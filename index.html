<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آفاق المستقبل — معاينة</title>
<style>
:root{
  --blue-deep:#0A1F33; --blue:#0E2A47; --paper:#F4EBDB; --wash:rgba(207,230,248,.86);
  --red:#A02B22; --redlite:#E8837A; --chip:rgba(220,234,255,.94); --rule:rgba(10,31,51,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Alexandria','Noto Naskh Arabic',-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--blue); color:var(--blue-deep);
}
.phone{max-width:430px;margin:0 auto;min-height:100%;position:relative;background:#dfeefb;overflow:hidden}
.bg{position:fixed;inset:0;max-width:430px;margin:0 auto;background-size:cover;background-position:center}
.wash{position:fixed;inset:0;max-width:430px;margin:0 auto;background:var(--wash)}
.screen{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:18px 22px 0}
main{flex:1;overflow-y:auto;padding-bottom:14px}
h1{font-size:29px;margin:.2em 0;font-weight:700}
.lead{font-size:15px;line-height:1.7;color:rgba(10,31,51,.88)}
.meta{font-size:11px;color:rgba(10,31,51,.66);letter-spacing:0}
.rule{height:1px;background:var(--rule);margin:12px 0}
.band{
  display:block;width:100%;border:0;background:var(--red);color:#fff;text-align:start;
  padding:16px 18px;font-size:19px;font-weight:700;margin-top:auto;cursor:pointer;
}
.band small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:3px}
.band[disabled]{background:#a9b9c9;cursor:not-allowed}
.chip{background:var(--chip);border:1px solid var(--rule);padding:12px 14px;margin:10px 0}
.chip.sel{border:2px solid var(--red)}
button.plain{background:none;border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%}
.row{display:flex;gap:10px;align-items:baseline;margin:10px 0}
.num{font-size:11px;color:rgba(10,31,51,.6)}
.acc{color:var(--red);font-weight:700}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--rule)}
.letter{width:28px;height:28px;border:1.4px solid var(--blue-deep);display:grid;place-items:center;flex:0 0 auto}
.optscale{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.optscale button{flex:1 1 30%;padding:8px 4px;border:1px solid var(--rule);background:rgba(255,255,255,.5);font:inherit;font-size:11px;cursor:pointer}
.optscale button.on{background:var(--red);color:#fff;border-color:var(--red)}
.card{background:var(--chip);border:1px solid var(--rule);margin:12px 0}
.card img{width:100%;height:150px;object-fit:cover;display:block}
.card .body{padding:12px 14px}
.strip{font-size:11px;color:var(--red);padding:9px 14px;border-top:1px solid var(--rule);display:flex;justify-content:space-between}
.small{font-size:12px;color:rgba(10,31,51,.72)}
img.plate{width:100%;height:170px;object-fit:cover;display:block;margin:10px 0}
.footer{padding:14px 0 26px;font-size:11px;color:rgba(10,31,51,.6);text-align:center}
</style>
</head>
<body>
<div class="phone">
  <div class="bg" id="bg"></div>
  <div class="wash"></div>
  <div class="screen" id="screen"></div>
</div>
<script type="module">
const DATA = await (await fetch('data.json?v=aea29e9c3e')).json();
const CASES = DATA.cases;
const TEST = DATA.interest;
const scale = TEST.scale.labels;
const maxScale = Math.max(...scale.map(s => s.value));
const state = { stage:'welcome', track:null, caseId:null, step:0, chosen:{}, revealed:new Set(),
                q:0, answers:{}, testAnswers:{}, results:{}, stop:0 };

const bgFor = f => f ? `url('img/${f}')` : 'none';
const setBg = f => { document.getElementById('bg').style.backgroundImage = bgFor(f); };
const L = o => (o && typeof o === 'object' ? (o.ar || o.en || '') : (o || ''));
const esc = s => String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function specialties(){
  const map = new Map();
  for (const c of CASES){
    const id = c.specialty.id;
    if (!map.has(id)) map.set(id, {id, name:c.specialty.name, cases:[]});
    map.get(id).cases.push(c);
  }
  return [...map.values()];
}
const live = () => specialties().map(s => {
  const rows = Object.values(state.results).filter(r => r.specialtyID === s.id);
  const interest = interestLean(s.id);
  const score = rows.reduce((a,r)=>a+r.score,0), total = rows.reduce((a,r)=>a+r.total,0);
  const dr = rows.reduce((a,r)=>a+r.decisionsRight,0), dt = rows.reduce((a,r)=>a+r.decisionsTotal,0);
  const dok = rows.reduce((a,r)=>Math.max(a,r.dok),0);
  const fit = rows.length && total ? interest*0.5 + (score/total)*0.5 : interest*0.5;
  return {...s, cases: rows.length, score, total, dr, dt, dok, fit, percent: Math.round(fit*100)};
}).sort((a,b)=>b.fit-a.fit);

function interestLean(sid){
  const items = TEST.items.filter(i => i.dimension === sid);
  if (!items.length) return 0;
  const sum = items.reduce((a,i)=>a + (state.testAnswers[i.id]||0), 0);
  return sum / (items.length * maxScale);
}
const currentCase = () => CASES.find(c => c.id === state.caseId) || CASES[0];
const T = k => (window.__l10n = window.__l10n || {})[k] || k;

/* ---------------------------------------------------------------- screens */
function welcome(){
  setBg('screen-welcome.jpg');
  return `<main>
    <div class="meta">آفاق المستقبل</div>
    <div class="small" style="margin-top:4px">يوم في حياة طبيب القلب · يوم في حياة طبيب الأطفال · وبقية المسارات</div>
    <div style="height:34vh"></div>
    <h1>لن تقرأ عن المهنة.<br><span class="acc">ستعيشها.</span></h1>
    <p class="lead">تختبِر ما يستهويك، ثم تعيش يوماً كاملاً في التخصص، ثم تعرف هل يشبهك.</p>
  </main>
  <button class="band" onclick="go('intro')">ابدأ اليوم الأول <small>لا يجمع التطبيق أي بيانات</small></button>
  <div style="text-align:center;padding:10px 0 16px">
    <a href="#" onclick="state.track='emergency-medicine';window.jumpStop(0);go('tour');return false" style="color:var(--blue-deep);font-size:12px">جولة داخل قسم الطوارئ ‹</a>
  </div>`;
}

function intro(){
  setBg('screen-intro.jpg');
  return `<main>
    <h1>قبل أن تختار تخصصك…</h1>
    <p class="lead">هذه معاينة للمحتوى الحقيقي: ${CASES.length} حالة في ${specialties().length} تخصص. كل حالة أربع خطوات وأربعة أسئلة متدرّجة، ولكل خطوة مصدرها.</p>
    <div class="rule"></div>
    <p class="small">ملاحظة: هذه نسخة ويب للمعاينة السريعة، والتطبيق الأصلي على iOS وAndroid.</p>
  </main>
  <button class="band" onclick="go('test')">لنبدأ</button>`;
}

function test(){
  setBg('screen-test.jpg');
  const answered = Object.keys(state.testAnswers).length;
  const rows = TEST.items.map((it, idx) => {
    const chips = scale.map(s => `<button class="${state.testAnswers[it.id]===s.value?'on':''}"
        onclick="answerTest('${it.id}',${s.value})">${esc(s.text.ar)}</button>`).join('');
    return `<div class="rule"></div>
      <div style="margin:10px 0 2px">${esc((idx+1)+'. '+it.text.ar)}</div>
      <div class="optscale">${chips}</div>`;
  }).join('');
  return `<main>${rows}<div class="footer">${answered} / ${TEST.items.length}</div></main>
  <button class="band" ${answered < TEST.items.length ? 'disabled' : ''}
    onclick="go('fit')">أظهر النتيجة <small>${answered < TEST.items.length ? 'أكمل الأسئلة أولاً' : 'جاهز'}</small></button>`;
}

function fit(){
  setBg('screen-fit.jpg');
  const lean = live().filter(s => s.fit > 0.45).slice(0,3);
  const named = lean.length ? lean.map(s => s.name.ar).join(' · ') : 'قلب';
  return `<main>
    <h1>ما تشير إليه إجاباتك</h1>
    <div class="acc" style="font-size:26px;font-weight:700">${esc(named)}</div>
    <div class="rule"></div>
    <p class="lead">اختر يوماً لتعيشه من المسارات المتاحة، وسيُقاس أداؤك على الحالة نفسها.</p>
  </main>
  <button class="band" onclick="go('tracks')">اختر مسارك</button>`;
}

function tracks(){
  setBg('screen-fit.jpg');
  const cards = specialties().map(s => `
    <div class="card ${state.track===s.id?'sel':''}" onclick="pickTrack('${s.id}')">
      ${s.cases[0].background ? `<img src="img/${s.cases[0].background.file}" alt="">` : ''}
      <div class="body">
        <div style="font-weight:700">${esc(s.name.ar)}</div>
        <div class="small">${s.cases.length} حالات متاحة</div>
      </div>
      <div class="strip"><span>اختر هذا المسار</span><span>‹</span></div>
    </div>`).join('');
  return `<main><h1>اختر مسارك</h1>${cards}</main>
  <button class="band" onclick="go('cases')">اختر التخصص</button>`;
}

function cases(){
  setBg('screen-fit.jpg');
  const list = specialties().filter(s => !state.track || s.id === state.track);
  const cards = list.map(s => `
    <div class="acc" style="margin-top:14px">${esc(s.name.ar)}</div>` + s.cases.map(c => `
    <div class="card ${state.caseId===c.id?'sel':''}" onclick="pickCase('${c.id}')">
      ${c.cover ? `<img src="img/${c.cover.file}" alt="">` : ''}
      <div class="body">
        <div style="font-weight:700">${esc(c.title.ar)}</div>
        <div class="small">${esc(c.summary.ar)}</div>
        <div class="meta">Dok ${c.dok} · ${c.estimatedMinutes||0} دقيقة</div>
      </div>
      <div class="strip"><span>${state.caseId===c.id?'اخترت هذا اليوم':'اختر هذا اليوم'}</span><span>‹</span></div>
    </div>`).join('')).join('');
  const tourHere = DATA.tours[state.track];
  return `<main><h1>اختر يوماً لتعيشه</h1>
    <div class="small">${CASES.length} حالة متاحة</div>
    ${tourHere ? `<div class="chip" onclick="window.jumpStop(0); window.go('tour')" style="cursor:pointer">
      جولة داخل هذا القسم · ${tourHere.stops.length} محطات ‹</div>` : ''}
    ${DATA.tools[state.track] ? `<div class="chip" onclick="go('tools')" style="cursor:pointer">
      أدوات وأجهزة القسم · ${DATA.tools[state.track].items.length} ‹</div>` : ''}
    ${DATA.conditions[state.track] ? `<div class="chip" onclick="go('conditions')" style="cursor:pointer">
      أشهر الحالات في هذا القسم · ${DATA.conditions[state.track].items.length} ‹</div>` : ''}
    ${cards}</main>
  <button class="band" onclick="startCase()">ابدأ هذا اليوم</button>`;
}

function scenario(){
  const c = currentCase();
  const step = c.scenario[state.step];
  setBg(c.background ? c.background.file : 'background-day.jpg');
  const revealed = state.revealed.has(step.id);
  const picked = state.chosen[step.id];
  let body = `<div class="meta">${esc(c.specialty.name.ar)} · ${state.step+1} من ${c.scenario.length}</div>`;
  if (step.image) body += `<img class="plate" src="img/${step.image.file}" alt="">`;
  body += `<p class="lead">${esc(step.text.ar)}</p>`;
  if (step.kind === 'decision' && step.choices){
    const letters = ['أ','ب','ج','د','هـ'];
    body += `<div class="rule"></div><div style="font-weight:700;margin-bottom:6px">ماذا تفعل؟</div>`;
    body += step.choices.map((ch, i) => {
      const isPicked = picked === ch.id;
      const tag = revealed && ch.correct ? 'صحيح' : (revealed && isPicked ? 'غير آمن' : '');
      return `<div class="opt" onclick="choose('${step.id}','${ch.id}')">
        <div class="letter">${letters[i]||''}</div>
        <div style="flex:1">
          <div>${esc(ch.text.ar)}</div>
          ${tag ? `<div class="meta acc">${tag} — ${esc((ch.feedback||{}).ar||'')}</div>` : ''}
        </div></div>`;
    }).join('');
  }
  const nextLabel = state.step < c.scenario.length - 1 ? 'التالي' : 'إلى التقييم';
  const locked = step.kind === 'decision' && !revealed;
  return `<main>${body}</main>
    <button class="band" ${locked?'disabled':''} onclick="nextStep()">${nextLabel}
      <small>${locked?'اختر إجابة أولاً':''}</small></button>`;
}

function assessment(){
  const c = currentCase();
  const q = c.assessment[state.q];
  setBg('screen-assessment.jpg');
  const answered = state.answers[q.id];
  const letters = ['أ','ب','ج','د'];
  const body = `<div class="meta">تقييم · ${state.q+1} من ${c.assessment.length} · Dok ${q.dok}</div>
    <div style="font-weight:700;margin:10px 0">${esc(q.prompt.ar)}</div>` +
    q.choices.map((ch,i) => {
      const isPicked = answered === ch.id;
      const tag = answered && ch.correct ? 'صحيح' : (answered && isPicked ? 'غير صحيح' : '');
      return `<div class="opt" onclick="answerAssessment('${q.id}','${ch.id}')">
        <div class="letter">${letters[i]||''}</div>
        <div style="flex:1"><div>${esc(ch.text.ar)}</div>
        ${tag ? `<div class="meta">${tag} — ${esc(ch.explanation? '' : '')}</div>` : ''}</div></div>`;
    }).join('') +
    (answered ? `<div class="rule"></div><div class="small">${esc(q.explanation.ar)}</div>` : '');
  const last = state.q >= c.assessment.length - 1;
  return `<main>${body}</main>
    <button class="band" ${answered?'':'disabled'} onclick="nextQuestion()">
      ${last?'أظهر النتيجة':'التالي'}<small>${answered?(last?'ثم النتيجة':'السؤال التالي'):'اختر إجابة أولاً'}</small></button>`;
}

function dashboard(){
  const c = currentCase();
  setBg(c.background ? c.background.file : 'screen-dashboard.jpg');
  const total = Math.max(c.assessment.length,1);
  const right = c.assessment.filter(q => {
    const picked = state.answers[q.id];
    return (q.choices.find(x=>x.id===picked)||{}).correct === true;
  }).length;
  const decisions = c.scenario.filter(s => s.kind === 'decision');
  const made = decisions.filter(s => state.chosen[s.id]).length;
  const ok = decisions.filter(s => (s.choices.find(x=>x.id===state.chosen[s.id])||{}).correct).length;
  const pct = Math.round(right*100/total);
  // The band is content, not a rule in code: the case carries its own bands, so a harder day can
  // set a higher bar without touching the screen.
  const fraction = total ? right/total : 0;
  const bands = (c.grading && c.grading.bands) || [];
  // Bands are half-open (lower edge in, upper edge out) and the last one takes 100%, exactly as the
  // app reads them — a perfect score that falls off the end of the scale is a student with no result.
  const band = bands.find((b, i) => fraction >= b.min && (fraction < b.max || i === bands.length - 1));
  const bandBlock = band ? `<div class="chip" style="margin-top:12px">
      <b>مستواك في التقييم</b>
      <div class="acc" style="margin-top:4px">${esc(band.label.ar)}</div>
      <div class="small" style="margin-top:6px">${esc(band.message.ar)}</div>
    </div>` : '';
  return `<main>
    <div class="meta">نتيجتك</div>
    <h1>${esc(c.specialty.name.ar)}</h1>
    <div style="font-size:48px;font-weight:700">${pct}٪</div>
    <div class="meta">${right} / ${total} إجابات صحيحة</div>
    <div class="rule"></div>
    <div class="row"><span class="num">المواقف التي عشتها</span><span style="margin-inline-start:auto">${made} / ${decisions.length}</span></div>
    <div class="row"><span class="num">القرارات الصحيحة</span><span style="margin-inline-start:auto">${ok} / ${decisions.length}</span></div>
    <div class="row"><span class="num">الأسئلة</span><span style="margin-inline-start:auto">${right} / ${total}</span></div>
    <div class="rule"></div>
    ${bandBlock}
    <div class="small" style="margin-top:10px">${esc(c.outcome.fitMessage.ar)}</div>
    <div class="chip" style="margin-top:14px"><b>الخطوات التالية</b>
      <ul>${c.outcome.nextSteps.map(s=>`<li>${esc(s.ar)}</li>`).join('')}</ul></div>
    <div class="chip" onclick="window.makeDayCard()" style="cursor:pointer;background:var(--red);color:#fff">
      أنشئ بطاقة اليوم ‹</div>
    <div class="chip" onclick="go('profile')" style="cursor:pointer">ملفك عبر المسارات ‹</div>
  </main>
  <button class="band" onclick="go('cases')">اختر يوماً آخر <small>ثلاث حالات في هذا التخصص</small></button>`;
}

function tour(){
  const chosen = DATA.tours[state.track] || DATA.tours['emergency-medicine'] || DATA.tour;
  const stops = chosen.stops;
  const stop = stops[state.stop];
  setBg(stop.img);
  const route = stops.map((x,i) => `<button class="plain" style="flex:1;min-width:64px;padding:6px;border:1px solid var(--rule);
      background:${i===state.stop?'var(--red)':'rgba(255,255,255,.5)'};color:${i===state.stop?'#fff':'inherit'};
      font-size:10px" onclick="window.jumpStop(${i})">${i+1}. ${esc(L(x.title))}</button>`).join('');
  return `<main>
    <h1>${esc(L(chosen.title))}</h1>
    <div class="meta">${state.stop+1} من ${stops.length} — ${esc(L(stop.title))}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${route}</div>
    <img class="plate" style="height:220px" src="img/${stop.image || stop.img}" alt="">
    <div class="chip"><b>ماذا يحدث هنا</b><div class="small" style="margin-top:6px">${esc(L(stop.what))}</div></div>
    <div class="chip"><b>ما يلاحظه الطبيب</b><div class="small" style="margin-top:6px">${esc(L(stop.notice))}</div></div>
    <div class="footer">هذه جولة مصوّرة داخل القسم — صور حقيقية بدرجة لون واحدة.</div>
  </main>
  <button class="band" onclick="window.nextStop()">${state.stop < stops.length-1 ? 'المحطة التالية' : 'ابدأ يوماً في هذا التخصص'}
    <small>${state.stop < stops.length-1 ? '' : esc(chosen.specialtyID ? '' : '')}</small></button>`;
}

const TOUR_STAGE = 'tour';

function tools(){
  const chosen = DATA.tools[state.track] || DATA.tools[Object.keys(DATA.tools)[0]];
  if (!chosen) return '<main><h1>لا توجد أدوات بعد</h1></main>';
  setBg('screen-fit.jpg');
  const cards = chosen.items.map(it => `
    <div class="card">
      <img src="img/${it.image}" alt="" style="height:190px">
      <div class="body">
        <div style="font-weight:700">${esc(L(it.name))}</div>
        <div class="small">${esc(L(it.use))}</div>
      </div>
    </div>`).join('');
  return `<main>
    <h1>${esc(L(chosen.title))}</h1>
    <div class="small">${esc(L(chosen.intro))}</div>
    ${cards}
  </main>
  <button class="band" onclick="go('cases')">اختر يوماً لتعيشه</button>`;
}

function conditions(){
  const chosen = DATA.conditions[state.track] || DATA.conditions[Object.keys(DATA.conditions)[0]];
  if (!chosen) return '<main><h1>لا توجد حالات بعد</h1></main>';
  setBg('screen-fit.jpg');
  const rows = chosen.items.map(it => `
    <div class="card">
      <div class="body">
        <div style="font-weight:700">${esc(L(it.name))}</div>
        <div class="small" style="margin-top:6px">${esc(L(it.complaint))}</div>
        <div class="small" style="margin-top:8px;border-inline-start:2px solid #A02B22;padding-inline-start:8px">${esc(L(it.alert))}</div>
        ${it.caseID ? `<div class="meta acc" style="margin-top:8px">عِش يوماً في هذه الحالة ‹</div>` : ''}
      </div>
    </div>`).join('');
  return `<main>
    <h1>${esc(L(chosen.title))}</h1>
    <div class="small">${esc(L(chosen.intro))}</div>
    ${rows}
  </main>
  <button class="band" onclick="go('cases')">اختر يوماً لتعيشه</button>`;
}

function profile(){
  setBg('screen-dashboard.jpg');
  const rows = live();
  const lived = rows.filter(r => r.cases > 0);
  const body = rows.map((r,i) => `<div class="rule"></div>
    <div class="row">
      <span class="num">${i+1}.</span><span style="font-weight:700">${esc(r.name.ar)}</span>
      <span style="margin-inline-start:auto" class="${r.cases?'acc':''}">
        ${r.cases ? r.percent+'٪' : 'بيانات غير كافية'}</span>
    </div>
    <div class="meta">${r.cases
      ? `${r.cases} حالة · ${r.score}/${r.total} إجابات صحيحة · ${r.dr}/${r.dt} قرارات صحيحة · Dok ${r.dok}`
      : 'من إجاباتك فقط — لم تعش يوماً في هذا التخصص بعد'}</div>`).join('');
  const next = rows.filter(r=>!r.cases).sort((a,b)=>b.fit-a.fit)[0];
  const conclusion = lived.length >= 3
    ? `أقرب مسار إليك: <b>${esc(lived[0].name.ar)}</b> — ${lived[0].percent}٪`
    : 'العيّنة صغيرة. عِش يوماً في تخصصين آخرين حتى تستحق الخلاصة أن تُقرأ.';
  return `<main>
    <h1>ملفك عبر المسارات</h1>
    <div class="meta">كل رقم هنا محسوب من إجاباتك وأيامك التي عشتها، لا من شيء آخر.</div>
    ${body}
    <div class="rule"></div>
    <div class="chip">
      <b>الخلاصة</b>
      <div class="small" style="margin-top:6px">${conclusion}</div>
      ${next?`<div class="acc" style="margin-top:8px">التخصص الذي يستحق تجربتك التالية: ${esc(next.name.ar)}</div>`:''}
    </div>
    <div class="footer"><a href="#" onclick="go('dashboard');return false">‹ رجوع</a></div>
  </main>
  <button class="band" onclick="go('cases')">اختر يوماً آخر</button>`;
}

/* ---------------------------------------------------------------- actions */
function go(stage){ state.stage = stage; render(); window.scrollTo(0,0); }
function pickTrack(id){
  // Pressing a path opens it. Selecting alone left the card looking dead: the author pressed every
  // specialty on the shelf and nothing came.
  state.track = id;
  state.caseId = (specialties().find(s=>s.id===id)||{cases:[CASES[0]]}).cases[0].id;
  go('cases');
}
function pickCase(id){ state.track = CASES.find(c=>c.id===id).specialty.id; state.caseId = id; render(); }
function startCase(){ if(!state.caseId) state.caseId = CASES[0].id; state.step = 0; state.chosen = {}; state.revealed = new Set(); state.q = 0; state.answers = {}; go('scenario'); }
function answerTest(id,v){ state.testAnswers[id] = v; render(); }
function choose(stepId, choiceId){ state.chosen[stepId] = choiceId; state.revealed.add(stepId); render(); }
function nextStep(){
  const c = currentCase();
  if (state.step < c.scenario.length - 1){ state.step++; render(); window.scrollTo(0,0); }
  else { state.q = 0; go('assessment'); }
}
function answerAssessment(qid, choiceId){ state.answers[qid] = choiceId; render(); }
function nextQuestion(){
  const c = currentCase();
  if (state.q < c.assessment.length - 1){ state.q++; render(); window.scrollTo(0,0); }
  else { record(); go('dashboard'); }
}
function record(){
  const c = currentCase();
  const total = Math.max(c.assessment.length,1);
  const score = c.assessment.filter(q => (q.choices.find(x=>x.id===state.answers[q.id])||{}).correct === true).length;
  const decisions = c.scenario.filter(s=>s.kind==='decision');
  const right = decisions.filter(s => (s.choices.find(x=>x.id===state.chosen[s.id])||{}).correct).length;
  state.results[c.id] = {specialtyID:c.specialty.id, score, total, decisionsRight:right,
                         decisionsTotal:decisions.length, dok:c.dok};
}
function again(){ state.step=0; state.chosen={}; state.revealed=new Set(); state.q=0; state.answers={}; go('scenario'); }

const SCREENS = {welcome, intro, test, fit, tracks, cases, scenario, assessment, dashboard, profile, tour, tools, conditions};
function render(){ document.getElementById('screen').innerHTML = SCREENS[state.stage](); }
// A module's functions are not global, and the markup uses inline handlers: expose the actions.
function jumpStop(i){ state.stop = i; render(); window.scrollTo(0,0); }
function nextStop(){
  const n = DATA.tour.length;
  if (state.stop < n - 1){ state.stop++; render(); window.scrollTo(0,0); }
  else {
    if (!DATA.tours[state.track]) state.track = 'emergency-medicine';
    state.caseId = (CASES.find(c => c.specialty.id === 'emergency-medicine') || CASES[0]).id;
    state.step = 0; state.chosen = {}; state.revealed = new Set(); state.q = 0; state.answers = {};
    go('scenario');
  }
}
/* ---------------------------------------------------- the day card (shareable) */
// One image the student can post: the day, its numbers, the path it points at. Drawn on a canvas at
// story size so it needs no library and no second layout to drift from the screens.
async function makeDayCard() {
  const c = currentCase();
  const total = Math.max(c.assessment.length, 1);
  const right = c.assessment.filter(q => (q.choices.find(x => x.id === state.answers[q.id]) || {}).correct === true).length;
  const decisions = c.scenario.filter(s => s.kind === 'decision');
  const made = decisions.filter(s => (s.choices.find(x => x.id === state.chosen[s.id]) || {}).correct).length;
  const fraction = total ? right / total : 0;
  const bands = (c.grading && c.grading.bands) || [];
  const band = bands.find((b, i) => fraction >= b.min && (fraction < b.max || i === bands.length - 1));
  const lived = live().filter(r => r.cases > 0);

  const W = 1080, H = 1920;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.direction = 'rtl'; g.textAlign = 'right';
  const font = (size, weight) => `${weight || 400} ${size}px Alexandria, 'Noto Naskh Arabic', system-ui, sans-serif`;

  // field
  g.fillStyle = '#0A1F33'; g.fillRect(0, 0, W, H);
  // the day's own photograph, washed into the field
  const bg = c.background && c.background.file;
  if (bg) {
    await new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const scale = Math.max(W / im.width, 880 / im.height);
        const w = im.width * scale, h = im.height * scale;
        g.globalAlpha = 0.9;
        g.drawImage(im, (W - w) / 2, 0, w, h);
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(207,230,248,0.55)'; g.fillRect(0, 0, W, h);
        // fade into the field
        const grad = g.createLinearGradient(0, h - 420, 0, h);
        grad.addColorStop(0, 'rgba(10,31,51,0)'); grad.addColorStop(1, 'rgba(10,31,51,1)');
        g.fillStyle = grad; g.fillRect(0, h - 420, W, 420);
        // the crown: a photograph at this end is usually bright, and cream type on it disappears
        const top = g.createLinearGradient(0, 0, 0, 300);
        top.addColorStop(0, 'rgba(10,31,51,0.92)'); top.addColorStop(1, 'rgba(10,31,51,0)');
        g.fillStyle = top; g.fillRect(0, 0, W, 300);
        res();
      };
      im.onerror = res;
      im.src = 'img/' + bg;
    });
  }

  // a solid ink panel under the type block, feathered at its top edge
  const panelTop = 900;
  const feather = g.createLinearGradient(0, panelTop - 160, 0, panelTop + 40);
  feather.addColorStop(0, 'rgba(10,31,51,0)'); feather.addColorStop(1, 'rgba(10,31,51,1)');
  g.fillStyle = feather; g.fillRect(0, panelTop - 160, W, 200);
  g.fillStyle = '#0A1F33'; g.fillRect(0, panelTop + 40, W, H - panelTop - 40);

  const M = 72;
  g.fillStyle = 'rgba(244,235,219,0.75)'; g.font = font(30, 500);
  g.fillText('آفاق المستقبل', W - M, 104);
  g.textAlign = 'left';
  g.fillStyle = 'rgba(244,235,219,0.55)'; g.font = font(28, 300);
  g.fillText('يوم من أيامك', M, 104, W / 2);
  g.textAlign = 'right';

  g.fillStyle = 'rgba(244,235,219,0.85)'; g.font = font(54, 300);
  g.fillText('يوم في حياة', W - M, 1060);

  g.fillStyle = '#E8837A'; g.font = font(112, 700);
  g.fillText(c.specialty.name.ar, W - M, 1180, W - 2 * M);

  g.fillStyle = 'rgba(244,235,219,0.9)'; g.font = font(40, 400);
  // the case title, wrapped to the card's width
  const words = c.title.ar.split(' ');
  let line = '', y = 1260;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > W - 2 * M && line) { g.fillText(line, W - M, y); y += 56; line = w; }
    else line = test;
  }
  if (line) g.fillText(line, W - M, y);

  // figures
  const fy = 1490;
  g.fillStyle = 'rgba(244,235,219,0.25)'; g.fillRect(M, fy - 120, W - 2 * M, 2);
  g.fillStyle = '#F4EBDB'; g.font = font(72, 700);
  g.fillText(`${right}/${total}`, W - M, fy);
  g.fillText(`${made}/${decisions.length}`, W - M - 380, fy);
  g.fillStyle = 'rgba(244,235,219,0.6)'; g.font = font(30, 300);
  g.fillText('الأسئلة', W - M, fy + 46);
  g.fillText('القرارات', W - M - 380, fy + 46);

  if (band) {
    g.font = font(42, 600);
    const label = band.label.ar;
    const tw = g.measureText(label).width;
    const pad = 34;
    g.fillStyle = '#A02B22';
    g.fillRect(W - M - tw - pad * 2, fy + 116, tw + pad * 2, 100);
    g.fillStyle = '#F4EBDB';
    g.fillText(label, W - M - pad, fy + 184);
  }

  if (lived.length) {
    g.fillStyle = 'rgba(244,235,219,0.85)'; g.font = font(38, 500);
    g.fillText(`أقرب مسار إليّ: ${lived[0].name.ar}`, W - M, fy + 330);
  }
  g.fillStyle = 'rgba(244,235,219,0.5)'; g.font = font(26, 300);
  g.fillText('جرّب يوماً في تخصص آخر · mine-fnl.github.io/masar-preview', W - M, H - 56);

  showDayCard(cv.toDataURL('image/png'));
}

function showDayCard(url) {
  const old = document.getElementById('daycard');
  if (old) old.remove();
  const box = document.createElement('div');
  box.id = 'daycard';
  box.style.cssText = 'position:fixed;inset:0;background:rgba(10,31,51,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px';
  box.innerHTML = `
    <img src="${url}" style="max-height:64vh;border:1px solid rgba(244,235,219,.3)">
    <div style="display:flex;gap:10px;width:100%;max-width:430px">
      <a download="afaq-day-card.png" href="${url}" style="flex:1;background:#A02B22;color:#fff;padding:14px;text-align:center;text-decoration:none;font-size:15px">نزّل البطاقة</a>
      <button onclick="document.getElementById('daycard').remove()" style="flex:1;background:none;border:1px solid rgba(244,235,219,.5);color:#F4EBDB;font:inherit;padding:14px;cursor:pointer">إغلاق</button>
    </div>`;
  document.body.appendChild(box);
}

Object.assign(window, {go, pickTrack, pickCase, startCase, answerTest, choose, nextStep,
                       answerAssessment, nextQuestion, again, jumpStop, nextStop, makeDayCard});
render();
</script>
</body>
